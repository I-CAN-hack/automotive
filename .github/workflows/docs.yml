name: Python documentation

on: [push]

permissions:
  contents: read

concurrency:
  group: python-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest
          python-version: "3.14"
          working-directory: python
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install libusb-1.0-0-dev libclang-dev pkg-config
      - name: Install library and documentation tools
        run: uv sync --locked --no-default-groups --group docs
      - name: Build documentation
        run: uv run --locked --no-default-groups --group docs sphinx-build -b html -W --keep-going docs docs/_build/html
      - name: Upload documentation
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: python/docs/_build/html

  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: python-docs-deployment
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
