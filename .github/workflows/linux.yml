name: Linux

on: [push]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Setup SocketCAN
        run: |
          sudo apt-get update
          sudo apt-get -y install "linux-modules-$(uname -r)" can-utils
          # Newer Azure kernels include CAN drivers in linux-modules; older kernels need extras.
          if apt-cache show "linux-modules-extra-$(uname -r)" >/dev/null 2>&1; then
            sudo apt-get -y install "linux-modules-extra-$(uname -r)"
          fi
          pip install --user scapy==2.8.0
          scripts/build_can_isotp.sh
          scripts/set_up_vcan.sh
      - name: Build
        run: cargo build --verbose --features=serde
      - name: Build Examples
        run: cargo build --verbose --features=serde --examples
      - name: Run tests
        run: cargo test --features=test-vcan,serde --verbose
