[package]
name = "automotive-python"
version = "0.4.1"
edition = "2021"
license = "MIT"
publish = false
description = "Python bindings for the automotive Rust crate"
repository = "https://github.com/I-CAN-hack/automotive"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
automotive = { path = "..", features = ["all-adapters"] }
pyo3 = "0.29"
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
futures = "0.3"
strum = "0.26"
